<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial de Albaranes — CIEMAT URAyVR</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; font-size: 13px; background: #c8d4e0; padding: 20px 0; min-height: 100vh; }

.toolbar {
  max-width: 1100px; margin: 0 auto 10px auto;
  display: flex; gap: 8px; justify-content: space-between; align-items: center; padding: 0 4px;
}
.toolbar-left { font-size: 13px; font-weight: 700; color: #003366; }
.toolbar a {
  background: #fff; color: #003366; border: 1px solid #b0becc;
  padding: 6px 16px; border-radius: 4px; font-size: 12px; font-weight: 600;
  text-decoration: none; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.toolbar a:hover { background: #e8f0fb; }
.toolbar a.primary { background: #003366; color: #fff; border-color: #003366; }
.toolbar a.primary:hover { background: #004d99; }

.page { background: #fff; width: 100%; max-width: 1100px; margin: 0 auto;
  padding: 24px 32px; box-shadow: 0 4px 24px rgba(0,0,0,.18); border-radius: 4px; }

/* Cabecera */
.hdr-strip {
  display: flex; align-items: center; gap: 16px;
  border-bottom: 2px solid #003366; padding-bottom: 14px; margin-bottom: 20px;
}
.hdr-logo { font-size: 20px; font-weight: 900; color: #003366; }
.hdr-title { font-size: 17px; font-weight: 700; color: #003366; text-transform: uppercase; letter-spacing: .06em; }
.hdr-sub { font-size: 11px; color: #666; margin-top: 2px; }

/* Barra de búsqueda/filtros */
.filters {
  display: grid; grid-template-columns: 1fr 1fr 1fr auto auto;
  gap: 8px; margin-bottom: 16px; align-items: end;
}
.filter-group label { display: block; font-size: 10px; font-weight: 700; color: #003366; margin-bottom: 3px; }
.filter-group input, .filter-group select {
  width: 100%; border: 1px solid #ccc; border-radius: 4px;
  padding: 6px 10px; font-size: 12px; outline: none; font-family: Arial, sans-serif;
}
.filter-group input:focus, .filter-group select:focus { border-color: #003366; background: #fffbe6; }
.btn-buscar {
  background: #003366; color: #fff; border: none; border-radius: 4px;
  padding: 7px 18px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.btn-buscar:hover { background: #004d99; }
.btn-limpiar {
  background: #fff; color: #555; border: 1px solid #ccc; border-radius: 4px;
  padding: 7px 14px; font-size: 12px; cursor: pointer; white-space: nowrap;
}
.btn-limpiar:hover { background: #f5f5f5; }

/* Tabla de resultados */
.results-info { font-size: 11px; color: #666; margin-bottom: 8px; }

table.hist-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
table.hist-tbl th {
  background: #003366; color: #fff; padding: 8px 10px;
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  white-space: nowrap;
}
table.hist-tbl th:first-child { border-radius: 4px 0 0 0; }
table.hist-tbl th:last-child  { border-radius: 0 4px 0 0; }
table.hist-tbl td { border-bottom: 1px solid #e8ecf0; padding: 9px 10px; vertical-align: middle; }
table.hist-tbl tr:hover td { background: #f0f6ff; }
table.hist-tbl tr:last-child td { border-bottom: none; }

.num-badge {
  background: #003366; color: #fff; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 3px; font-family: 'Courier New', monospace;
}
.cliente-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tipo-cell { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #444; }

.btn-ver {
  background: #e8f0fb; color: #003366; border: 1px solid #b0c8e8;
  padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: 700;
  cursor: pointer; text-decoration: none; display: inline-block; margin-right: 4px;
}
.btn-ver:hover { background: #c6d8f0; }
.btn-pdf {
  background: #1a7a4a; color: #fff; border: none;
  padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: 700;
  cursor: pointer; text-decoration: none; display: inline-block;
}
.btn-pdf:hover { background: #15633c; }
.btn-eliminar {
  background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1;
  padding: 4px 10px; border-radius: 3px; font-size: 11px; cursor: pointer; margin-left: 4px;
}
.btn-eliminar:hover { background: #f9ccc8; }

/* Paginación */
.paginacion {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 16px; padding-top: 12px; border-top: 1px solid #e0e6ec;
}
.pag-info { font-size: 11px; color: #666; }
.pag-btns { display: flex; gap: 4px; }
.pag-btn {
  background: #fff; border: 1px solid #ccc; border-radius: 3px;
  padding: 4px 10px; font-size: 11px; cursor: pointer;
}
.pag-btn:hover { background: #e8f0fb; }
.pag-btn.active { background: #003366; color: #fff; border-color: #003366; }
.pag-btn:disabled { opacity: .4; cursor: default; }

/* Estado vacío / cargando */
.empty-state { text-align: center; padding: 48px; color: #999; }
.empty-state .icon { font-size: 36px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

.loading { text-align: center; padding: 32px; color: #666; font-size: 13px; }
.spinner { display:inline-block; width:18px; height:18px; border:2px solid #ccc; border-top-color:#003366; border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Modal detalle */
#modalOverlay { display:none; position:fixed; inset:0; background:rgba(0,20,50,.6); z-index:999; align-items:center; justify-content:center; }
#modalOverlay.open { display:flex; }
.modal-box { background:#fff; border-radius:8px; width:780px; max-width:96vw; max-height:90vh; overflow-y:auto; box-shadow:0 6px 32px rgba(0,0,0,.3); }
.modal-hdr { background:#003366; color:#fff; padding:14px 20px; border-radius:8px 8px 0 0; display:flex; justify-content:space-between; align-items:center; }
.modal-hdr .t { font-weight:700; font-size:15px; }
.modal-close { background:none; border:none; color:#fff; font-size:20px; cursor:pointer; padding:2px 8px; }
.modal-close:hover { background:rgba(255,255,255,.2); border-radius:3px; }
.modal-body { padding:20px; }
.modal-section { margin-bottom:16px; }
.modal-section-title { font-size:11px; font-weight:700; color:#003366; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid #e0e6ec; padding-bottom:4px; margin-bottom:10px; }
.modal-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.modal-field label { font-size:10px; font-weight:700; color:#666; display:block; }
.modal-field span { font-size:12px; color:#222; }
.modal-analisis { width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; }
.modal-analisis th { background:#e8f0fb; color:#003366; padding:5px 8px; text-align:left; }
.modal-analisis td { padding:5px 8px; border-bottom:1px solid #eee; }
.modal-footer { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid #e0e6ec; }

@media print { .toolbar,.filters,.pag-btns,#modalOverlay { display:none !important; } }

/* ── RESPONSIVE MÓVIL ── */
@media (max-width: 700px) {
  body { padding: 8px 0; }

  .toolbar {
    flex-direction: column; align-items: stretch;
    padding: 8px 10px; gap: 6px;
  }
  .toolbar-left { text-align: center; font-size: 12px; }
  .toolbar > div:last-child { flex-direction: column; gap: 6px; }
  .toolbar a, .toolbar button { width: 100%; justify-content: center; text-align: center; padding: 10px; font-size: 13px; }

  .page { padding: 14px 10px; border-radius: 0; }

  .hdr-strip { flex-direction: column; align-items: flex-start; gap: 8px; }
  .hdr-title { font-size: 14px; }
  .hdr-sub { font-size: 11px; }

  /* Filtros: una columna */
  .filters {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .filters .filter-group:first-child { grid-column: 1 / -1; }
  .btn-buscar, .btn-limpiar { padding: 9px; font-size: 13px; }

  /* Tabla → tarjetas */
  table.hist-tbl { display: block; }
  table.hist-tbl thead { display: none; }
  table.hist-tbl tbody { display: block; }
  table.hist-tbl tr {
    display: block; border: 1px solid #d0dae6;
    border-radius: 6px; margin-bottom: 10px;
    padding: 10px 12px; background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  table.hist-tbl tr:hover td { background: transparent; }
  table.hist-tbl td {
    display: flex; align-items: flex-start;
    border-bottom: none; padding: 3px 0;
    font-size: 13px; gap: 6px;
  }
  table.hist-tbl td::before {
    content: attr(data-label);
    font-weight: 700; color: #003366;
    font-size: 10px; min-width: 100px;
    text-transform: uppercase; letter-spacing: .03em;
    padding-top: 2px;
  }
  table.hist-tbl td:last-child {
    justify-content: flex-start; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid #e8ecf0;
  }
  table.hist-tbl td:last-child::before { display: none; }
  .cliente-cell, .tipo-cell { white-space: normal; max-width: none; overflow: visible; }

  /* Botones de acción en tarjeta */
  .btn-ver, .btn-pdf, .btn-eliminar {
    padding: 7px 14px; font-size: 12px;
  }

  /* Paginación */
  .paginacion { flex-direction: column; gap: 10px; align-items: center; }
  .pag-info { text-align: center; }
  .pag-btns { flex-wrap: wrap; justify-content: center; }
  .pag-btn { padding: 6px 12px; font-size: 12px; }

  /* Modal detalle */
  .modal-box { width: 100vw; max-width: 100vw; border-radius: 0; max-height: 100vh; }
  .modal-grid { grid-template-columns: 1fr; }
  .modal-footer { flex-direction: column; gap: 8px; }
  .modal-footer a, .modal-footer button { width: 100%; text-align: center; justify-content: center; padding: 11px; font-size: 13px; }
  .modal-analisis { font-size: 12px; }
  .modal-analisis th, .modal-analisis td { padding: 6px 6px; }
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left"> Historial de Albaranes — CIEMAT URAyVR</div>
  <div style="display:flex;gap:8px;">
    <a href="/" class="primary">＋ Nuevo albarán</a>
    <button onclick="cerrarSesionAdmin()"
      style="background:#fff;color:#8b1a1a;border:1px solid #c0aaaa;border-radius:4px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.1);"
      onmouseover="this.style.background='#fdf0f0'" onmouseout="this.style.background='#fff'">
       Cerrar sesión
    </button>
  </div>
</div>

<div class="page">

  <div class="hdr-strip">
    <div>
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="background:#003366;color:#fff;font-weight:900;font-size:16px;padding:6px 12px;border-radius:3px;">CIEMAT</div>
        <div style="font-size:13px;font-weight:900;color:#003366;border:2px solid #003366;padding:4px 10px;border-radius:3px;">URA y VR</div>
      </div>
    </div>
    <div>
      <div class="hdr-title">Historial de Albaranes de Solicitud de Radioanálisis</div>
      <div class="hdr-sub">L104-RG01 — Registro de albaranes guardados</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filters">
    <div class="filter-group">
      <label>Buscar (cliente, ref., tipo muestra…)</label>
      <input type="text" id="fBuscar" placeholder="Buscar..." onkeydown="if(event.key==='Enter') buscar()">
    </div>
    <div class="filter-group">
      <label>Desde</label>
      <input type="date" id="fDesde">
    </div>
    <div class="filter-group">
      <label>Hasta</label>
      <input type="date" id="fHasta">
    </div>
    <button class="btn-buscar" onclick="buscar()"> Buscar</button>
    <button class="btn-limpiar" onclick="limpiarFiltros()">✕ Limpiar</button>
  </div>

  <!-- Resultados -->
  <div class="results-info" id="resultsInfo"></div>

  <div id="tableContainer">
    <div class="loading"><span class="spinner"></span> Cargando albaranes...</div>
  </div>

  <div class="paginacion" id="paginacion" style="display:none;">
    <div class="pag-info" id="pagInfo"></div>
    <div class="pag-btns" id="pagBtns"></div>
  </div>

</div>

<!-- Modal detalle -->
<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-hdr">
      <div class="t" id="modalTitle">Detalle del albarán</div>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <a id="modalEditBtn" href="#" class="btn-ver"> Editar</a>
      <button class="btn-pdf" onclick="imprimirModal()"> Imprimir / PDF</button>
      <button class="btn-limpiar" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>
</div>

<script>
let paginaActual = 1;
const porPagina = 20;
let totalRegistros = 0;
let datosCache = [];

async function cargarAlbaranes(pagina = 1) {
  paginaActual = pagina;
  const buscar = document.getElementById('fBuscar').value;
  const desde  = document.getElementById('fDesde').value;
  const hasta  = document.getElementById('fHasta').value;

  document.getElementById('tableContainer').innerHTML =
    '<div class="loading"><span class="spinner"></span> Cargando...</div>';

  try {
    const params = new URLSearchParams({
      pagina, por_pagina: porPagina,
      ...(buscar && { buscar }),
      ...(desde  && { desde }),
      ...(hasta  && { hasta })
    });
    const resp = await fetch(`/api/albaranes?${params}`);
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    datosCache = data.albaranes;
    totalRegistros = data.total;
    renderTabla(data.albaranes, data.total, pagina);
  } catch {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>Error al cargar los datos.<br>Comprueba que el servidor está activo.</p></div>';
  }
}

function renderTabla(albaranes, total, pagina) {
  const info = document.getElementById('resultsInfo');
  info.textContent = `${total} albarán${total !== 1 ? 'es' : ''} encontrado${total !== 1 ? 's' : ''}`;

  if (!albaranes.length) {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="icon">📭</div><p>No se encontraron albaranes con los filtros seleccionados.</p></div>';
    document.getElementById('paginacion').style.display = 'none';
    return;
  }

  const rows = albaranes.map(a => `
    <tr>
      <td data-label="Nº"><span class="num-badge">${String(a.id).padStart(5,'0')}</span></td>
      <td data-label="Fecha recepción">${formatFecha(a.fecha_recepcion) || '—'}</td>
      <td data-label="Cliente" class="cliente-cell" title="${a.cliente || ''}">${a.cliente || '—'}</td>
      <td data-label="Ref. URA">${a.ref_ura || '—'}</td>
      <td data-label="Tipo muestra" class="tipo-cell" title="${a.tipo_muestra || ''}">${a.tipo_muestra || '—'}</td>
      <td data-label="Pto. muestreo">${a.pto_muestreo || '—'}</td>
      <td data-label="Creado">${formatFecha(a.fecha_creacion)}</td>
      <td>
        <button class="btn-ver" onclick="verDetalle(${a.id})">👁 Ver</button>
        <button class="btn-pdf" onclick="generarPDF(${a.id})">🖨️ PDF</button>
        <button class="btn-eliminar" onclick="eliminarAlbaran(${a.id})" title="Eliminar">🗑</button>
      </td>
    </tr>
  `).join('');

  document.getElementById('tableContainer').innerHTML = `
    <table class="hist-tbl">
      <thead>
        <tr>
          <th>Nº Albarán</th>
          <th>F. Recepción</th>
          <th>Cliente</th>
          <th>Ref. URAyVR</th>
          <th>Tipo de muestra</th>
          <th>Pto. Muestreo</th>
          <th>Guardado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

  // Paginación
  const totalPags = Math.ceil(total / porPagina);
  if (totalPags > 1) {
    document.getElementById('paginacion').style.display = 'flex';
    document.getElementById('pagInfo').textContent =
      `Página ${pagina} de ${totalPags} (${total} registros)`;

    const btns = [];
    btns.push(`<button class="pag-btn" onclick="cargarAlbaranes(${pagina-1})" ${pagina===1?'disabled':''}>◀ Ant.</button>`);
    for (let p = Math.max(1, pagina-2); p <= Math.min(totalPags, pagina+2); p++) {
      btns.push(`<button class="pag-btn ${p===pagina?'active':''}" onclick="cargarAlbaranes(${p})">${p}</button>`);
    }
    btns.push(`<button class="pag-btn" onclick="cargarAlbaranes(${pagina+1})" ${pagina===totalPags?'disabled':''}>Sig. ▶</button>`);
    document.getElementById('pagBtns').innerHTML = btns.join('');
  } else {
    document.getElementById('paginacion').style.display = 'none';
  }
}

function formatFecha(f) {
  if (!f) return '';
  const d = new Date(f);
  if (isNaN(d)) return f;
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
}

function buscar() { cargarAlbaranes(1); }

function limpiarFiltros() {
  document.getElementById('fBuscar').value = '';
  document.getElementById('fDesde').value = '';
  document.getElementById('fHasta').value = '';
  cargarAlbaranes(1);
}

async function verDetalle(id) {
  try {
    const resp = await fetch(`/api/albaran/${id}`);
    const a = await resp.json();
    document.getElementById('modalTitle').textContent =
      `Albarán nº ${String(a.id).padStart(5,'0')} — ${a.cliente || 'Sin cliente'}`;
    document.getElementById('modalEditBtn').href = `/?id=${a.id}`;

    const analisisRows = (a.analisis || []).map(an => `
      <tr>
        <td>${an.analisis}</td>
        <td style="text-align:center;">${an.acumula ? '✓' : ''}</td>
        <td>${an.n_acum || ''}</td>
        <td>${an.de_tanto || ''}</td>
        <td>${an.ref_base || ''}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="color:#aaa;text-align:center;">Sin análisis registrados</td></tr>';

    document.getElementById('modalBody').innerHTML = `
      <div class="modal-section">
        <div class="modal-section-title">Identificación</div>
        <div class="modal-grid">
          <div class="modal-field"><label>Referencia URAyVR</label><span>${a.ref_ura || '—'}</span></div>
          <div class="modal-field"><label>Ref. Cliente URA</label><span>${a.ref_cliente_ura || '—'}</span></div>
          <div class="modal-field"><label>Cliente</label><span>${a.cliente || '—'}</span></div>
          <div class="modal-field"><label>Ref. Cliente</label><span>${a.ref_cliente || '—'}</span></div>
          <div class="modal-field"><label>Tipo de muestra</label><span>${a.tipo_muestra || '—'}</span></div>
          <div class="modal-field"><label>Punto de muestreo</label><span>${a.pto_muestreo || '—'}</span></div>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Recepción y Asignación</div>
        <div class="modal-grid">
          <div class="modal-field"><label>Fecha de recepción</label><span>${formatFecha(a.fecha_recepcion) || '—'}</span></div>
          <div class="modal-field"><label>Recepcionado por</label><span>${a.recepcionado_por || '—'}</span></div>
          <div class="modal-field"><label>Período de asignación</label><span>${a.periodo || '—'}</span></div>
          <div class="modal-field"><label>Enviado por</label><span>${a.enviado_por || '—'}</span></div>
          <div class="modal-field"><label>E-mail de reenvío</label><span>${a.email_reenvio || '—'}</span></div>
          <div class="modal-field"><label>Fecha</label><span>${formatFecha(a.fecha) || '—'}</span></div>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Análisis solicitados</div>
        <table class="modal-analisis">
          <thead><tr>
            <th>Análisis</th><th>Acumula</th><th>Nº acum.</th><th>De tanto</th><th>Ref. base</th>
          </tr></thead>
          <tbody>${analisisRows}</tbody>
        </table>
      </div>
      ${a.incidencias ? `
      <div class="modal-section">
        <div class="modal-section-title">Incidencias</div>
        <div style="font-size:12px;color:#333;background:#fffbe6;padding:8px 10px;border-radius:3px;border:1px solid #e0d89a;">${a.incidencias}</div>
      </div>` : ''}
      <div style="font-size:10px;color:#aaa;text-align:right;margin-top:8px;">
        Guardado: ${formatFecha(a.fecha_creacion)} &nbsp;|&nbsp; Última modificación: ${formatFecha(a.fecha_modificacion)}
      </div>
    `;
    document.getElementById('modalOverlay').classList.add('open');
  } catch {
    alert('Error al cargar el detalle del albarán.');
  }
}

function cerrarModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function imprimirModal() {
  // Extraer el ID del botón Editar (href puede ser relativa o absoluta)
  const href = document.getElementById('modalEditBtn').getAttribute('href') || '';
  const match = href.match(/[?&]id=(\d+)/);
  if (match) {
    window.open('/?id=' + match[1] + '&pdf=1', '_blank');
  } else {
    window.print();
  }
}

async function eliminarAlbaran(id) {
  if (!confirm(`¿Eliminar el albarán nº ${String(id).padStart(5,'0')}? Esta acción no se puede deshacer.`)) return;
  try {
    const resp = await fetch(`/api/albaran/${id}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error();
    cargarAlbaranes(paginaActual);
  } catch {
    alert('Error al eliminar el albarán.');
  }
}

async function generarPDF(id) {
  window.open(`/?id=${id}&pdf=1`, '_blank');
}

async function cerrarSesionAdmin() {
  await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
  window.location.replace('/');
}

// Cargar al inicio — verificar sesión admin primero
(async () => {
  try {
    const resp = await fetch('/api/admin/check', { credentials: 'include' });
    const data = await resp.json();
    if (!data.ok) {
      // No autenticado: redirigir al inicio
      window.location.replace('/');
      return;
    }
  } catch {
    window.location.replace('/');
    return;
  }
  cargarAlbaranes();
})();
</script>
